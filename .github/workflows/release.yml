# Adapted from cc-moss (MIT, https://github.com/larrykoo711/cc-moss).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Dry run: build and package this branch or tag, publish nothing"
        default: main
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.ref || github.ref_name }}

jobs:
  licenses:
    name: third-party licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-bundle-licenses
      # Binary archives must carry the notices of every dependency compiled in
      # (MIT/Apache require it; nucleo-matcher is MPL-2.0, source linked there).
      - run: cargo bundle-licenses --format toml --output THIRD-PARTY-LICENSES.toml
      - uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.toml
          if-no-files-found: error

  build:
    name: build ${{ matrix.target }}
    needs: licenses
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,       os: macos-latest }
          - { target: x86_64-apple-darwin,        os: macos-latest }
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
      - name: Check the tag matches Cargo.toml
        if: github.event_name == 'push'
        shell: bash
        run: |
          want="${TAG#v}"
          have="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$want" = "$have" ] || { echo "tag $TAG but Cargo.toml says $have"; exit 1; }
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin' || runner.arch == 'X64'
        run: ./target/${{ matrix.target }}/release/ta --version | tee /dev/stderr | grep -q "^ta "
      - uses: actions/download-artifact@v8
        with:
          name: third-party-licenses
      - name: Package
        shell: bash
        env:
          # macOS tar would add ._* files for extended attributes.
          COPYFILE_DISABLE: "1"
        run: |
          # A dry run of a branch like feature/x must not put a slash in the name.
          name="tmux-haha-${TAG//\//-}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/ta" LICENSE THIRD-PARTY-LICENSES.toml README.md README.en.md CHANGELOG.md "dist/$name/"
          # Owner 0 in the archive: an extraction under sudo must not hand the
          # binary to whichever local user shares the build machine's uid.
          if tar --version 2>/dev/null | grep -q GNU; then
            tar --owner=0 --group=0 --numeric-owner -C dist -czf "dist/$name.tar.gz" "$name"
          else
            tar --uid 0 --gid 0 -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # What a release would ship, checked before anything is published (on a
  # tag push, publish waits for it; a dry run stops here).
  check:
    name: Check the archives and the formula
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Archives
        shell: bash
        run: |
          tag="${TAG//\//-}"
          cd dist
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            name="tmux-haha-$tag-$t"
            # Listed first: grep -q closing the pipe early would fail it.
            files="$(tar -tzf "$name.tar.gz")"
            grep -qx "$name/ta" <<<"$files"
            grep -qx "$name/THIRD-PARTY-LICENSES.toml" <<<"$files"
            if grep -q '/\._' <<<"$files"; then echo "$name has ._ files"; exit 1; fi
          done
          mkdir -p x && tar -xzf "tmux-haha-$tag-aarch64-apple-darwin.tar.gz" -C x
          "x/tmux-haha-$tag-aarch64-apple-darwin/ta" --version
      - name: Formula
        shell: bash
        run: |
          tag="${TAG//\//-}"
          cat dist/*.sha256 > SHA256SUMS
          packaging/homebrew/render.sh "$tag" SHA256SUMS > tmux-haha.rb
          ruby -c tmux-haha.rb

  publish:
    name: GitHub Release
    needs: [build, check]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no CHANGELOG entry for $version"; exit 1; }
          cat dist/*.sha256 > dist/SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag like v0.2.0-rc.1 is a pre-release, never GitHub's "latest".
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS \
            --title "tmux-haha $TAG" --notes-file notes.md --verify-tag $pre

  homebrew:
    name: Bump Homebrew formula
    needs: publish
    runs-on: ubuntu-latest
    # TAP_DEPLOY_KEY: the private half of a deploy key with write access to
    # larrykoo711/homebrew-tap and nothing else (no personal token, no expiry).
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - name: Is there a deploy key for the tap?
        id: token
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -n "$TAP_DEPLOY_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No TAP_DEPLOY_KEY secret: update Formula/tmux-haha.rb in larrykoo711/homebrew-tap by hand"
          fi
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v7
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          repository: larrykoo711/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap
      - name: Render Formula/tmux-haha.rb
        if: steps.token.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          packaging/homebrew/render.sh "$TAG" SHA256SUMS > tap/Formula/tmux-haha.rb
      - name: Commit and push
        if: steps.token.outputs.ok == 'true'
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tmux-haha.rb
          # A re-run of the same release changes nothing: no empty commit.
          git diff --cached --quiet || { git commit -m "tmux-haha ${TAG}" && git push; }
